aid: foxglove-technologies
name: Foxglove Technologies
description: 'Foxglove Technologies, Inc. (foxglove.dev) builds a multimodal data platform
  for robotics, autonomy and physical AI. Its products cover visualization and debugging
  of robot data (3D scenes, images, plots, logs, maps), cloud and self-hosted data
  infrastructure for recording ingest and retention, fleet and device management, and
  an agent layer that lets AI assistants inspect recordings. Foxglove publishes an
  OpenAPI 3.1 REST API at api.foxglove.dev/v1 for devices, recordings, sessions, events,
  event types, custom properties, sites, tokens, extensions and layouts; a webhook
  event surface; SDKs for Python, Rust, C++, C, Go and TypeScript; a Go CLI; and the
  open-source MCAP container format and Foxglove message schemas.'
url: https://raw.githubusercontent.com/api-evangelist/foxglove-technologies/refs/heads/main/apis.yml
