api: Foxglove API v1 — https://api.foxglove.dev/v1
limit_count: 0
note: >-
  Foxglove states that the API is rate-limited but publishes NO numbers — no requests
  per window, no burst, no per-key or per-account scope. The documented contract is
  entirely runtime: a 429 status and a Retry-After header. Quoted verbatim from the
  API reference: "To help ensure responsiveness for all clients, requests to the API
  may be rate-limited. In this case, a request will receive a status code of 429.
  Your client may refer to headers, such as 'Retry-After', to determine when a
  request should be retried." No 429 response is declared on any operation in the
  OpenAPI, so a generated client will not model it.
limits: []
signaling:
  status_code_on_exhaustion: 429
  response_headers:
  - name: Retry-After
    description: Seconds (or HTTP-date) until the request may be retried. Named
      explicitly in the API reference.
    confirmed: documented
  - name: X-RateLimit-Limit
    confirmed: not-documented
  - name: X-RateLimit-Remaining
    confirmed: not-documented
  - name: RateLimit
    confirmed: not-documented
  guidance: >-
    "In general, if your client experiences an error, you should adjust the rate at
    which your client makes requests, and you may issue retries with a strategy such
    as exponential backoff."
adjacent_quota_limits:
  note: >-
    Foxglove's published quantitative limits are commercial quotas on the pricing
    page rather than API request-rate limits; they are captured in
    plans/foxglove-technologies-plans-pricing.yml (storage, seats, devices,
    projects, query time, indexing, bandwidth).
  pagination_ceiling:
    parameter: limit
    default: 2000
    maximum: 2000
    on_exceed: HTTP 400
    source: https://docs.foxglove.dev/api/llms.txt
gaps:
- No numeric rate limit is published, so a client cannot plan concurrency ahead of
  the first 429.
- No RateLimit-* / X-RateLimit-* headers are documented, so a client cannot see how
  close it is to the ceiling before being cut off.
- 429 is absent from every operation's responses block in the OpenAPI.
