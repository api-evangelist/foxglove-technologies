            minLength: 1
          required: false
        - in: query
          name: sessionKey
          description: Key of a recording session to list topics from
          schema:
            type: string
            minLength: 1
          required: false
        - in: query
          name: includeSchemas
          description: Whether full schemas should be included in the response
          schema:
            type: boolean
            default: false
          required: false
        - in: query
          name: sortBy
          description: Sort by a single field of the topic type ("topic" or "version")
          schema:
            type: string
            enum:
              - topic
              - version
          required: false
        - in: query
          name: projectId
          description: Filter topics matching project ID
          schema:
