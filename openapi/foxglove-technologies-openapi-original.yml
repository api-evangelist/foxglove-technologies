  /site-bucket-notifications:
    post:
      tags:
        - Sites
      summary: Notify new recording
      description: >
        Notify your primary site of a new recording to ingest. Most users should
        set up [Bucket

        notifications](/docs/data/primary-sites/installation#bucket-push-notification)

        instead.


        This endpoint requires a Site Bucket Notification Token as bearer token
        in the Authorization header:


        ```

        Authorization: Bearer fox_snt_1234...

        ```
      security:
        - SiteBucketNotificationBearerToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                messageId:
                  type: string
                  description: >-
                    Unique message identifier. Notifications will be
                    deduplicated based on this value.
                fileName:
                  type: string
                  description: The name of the recording file in the bucket.
                  minLength: 1
                bucketName:
                  type: string
                  description: Bucket name
                  minLength: 1
                storageProvider:
                  type: string
                  enum:
                    - google_cloud
                    - aws
                    - azure
                    - s3_compatible
                  description: >
                    Storage provider used for the bucket. This must match the
                    storage provider

                    configured for your primary site's inbox bucket or indexed
                    bucket.
                deviceId:
                  type: string
                  description: >
                    Device to associate with the recording. This takes
                    precedence over values

                    provided in [object metadata or MCAP
                    metadata](/docs/primary-sites/self-hosting/manage-data#adding-metadata-to-imports).
                  minLength: 1
                deviceName:
                  type: string
                  description: >
                    Name of the device to associate with the recording. The
                    device is looked up by

                    name and created if it does not already exist. `deviceId`
                    takes precedence over

                    `deviceName` when both are provided. An existing device with
                    a unique name

                    resolves without a `projectId`. Provide `projectId` to
                    disambiguate when the

                    name matches devices in multiple projects, or to choose
                    which project a new

                    device is created in when your organization has multiple
                    projects. This takes

                    precedence over values provided in

                    [object metadata or MCAP
                    metadata](/docs/primary-sites/self-hosting/manage-data#adding-metadata-to-imports).
                  minLength: 1
                projectId:
                  type: string
                  description: >
                    Project to associate with the recording. This takes
                    precedence over values

                    provided in [object metadata or MCAP
                    metadata](/docs/primary-sites/self-hosting/manage-data#adding-metadata-to-imports).
                  minLength: 1
              required:
                - messageId
                - fileName
                - bucketName
                - storageProvider
      responses:
        '200':
          description: success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericSuccess'
