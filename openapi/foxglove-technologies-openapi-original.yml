            multi-project orgs.
          schema:
            type: string
          required: false
        - in: query
          name: query
          description: >-
            Space-separated query string for device property history. Each
            custom property key must be valid. See above for syntax and
            examples.
          schema:
            type: string
          required: false
        - in: query
          name: start
          description: Properties active on or after this time will be included.
          schema:
            type: string
            format: date-time
          required: false
        - in: query
          name: end
          description: Properties active before this time will be included.
          schema:
            type: string
            format: date-time
          required: false
        - in: query
          name: sortBy
