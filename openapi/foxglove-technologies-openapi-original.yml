            type: string
          required: false
        - in: query
          name: recordingId
          description: Filter coverage by recording ID
          schema:
            type: string
          required: false
        - in: query
          name: recordingKey
          description: Filter coverage by recordingKey
          schema:
            type: string
          required: false
        - in: query
          name: sessionId
          description: Filter coverage to recordings in the session with this ID
          schema:
            type: string
          required: false
        - in: query
          name: sessionKey
