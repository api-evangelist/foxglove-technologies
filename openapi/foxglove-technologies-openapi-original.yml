        - ApiKey:
            - layouts.list
      parameters:
        - in: query
          name: updatedSince
          description: Return only layouts updated since this time.
          schema:
            type: string
            format: date-time
        - in: query
          name: includeData
          description: >
            When set to false, the `data` field is omitted from the response
            items.

            This can be used to limit bandwidth when querying many Layouts.
          schema:
            type: boolean
            default: true
      responses:
        '200':
          description: List of org layouts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Layout'
    post:
      tags:
        - Layouts
      summary: Create a layout
      description: |
        Creates a layout. API keys can only create shared layouts.
      security:
        - ApiKey:
            - layouts.create
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: string
                  maxLength: 36
                name:
                  type: string
                savedAt:
                  type: string
                  format: date-time
                folderName:
                  type: string
                  pattern: ^[^/]*$
                  description: |
                    The folder name used to organize layouts in the UI.
                    It cannot contain forward slashes.
                permission:
                  $ref: '#/components/schemas/LayoutPermission'
                data:
                  type: object
                  additionalProperties: true
                  description: >
                    The layout contents. This format is not yet stable and may
                    change without

                    notice; treat it as opaque and round-trip values returned by
                    the API.
              required:
                - data
                - name
                - permission
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Layout'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Conflict with ID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
