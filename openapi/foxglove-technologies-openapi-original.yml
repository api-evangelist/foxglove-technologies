  /extension-upload:
    post:
      tags:
        - Extensions
      summary: Publish an extension
      description: >-
        **Available on Free, Pro, and Enterprise plans**


        Publish a new [Foxglove
        extension](https://docs.foxglove.dev/docs/extensions)

        or an updated version of an existing extension. When uploaded, the
        extension will automatically be

        installed for users in your organization.


        See our packaging tool
        [`create-foxglove-extension`](https://github.com/foxglove/create-foxglove-extension/)

        for more information on how to create an extension.


        Read the [docs](https://docs.foxglove.dev/docs/extensions)

        for more information on Foxglove extensions.
      requestBody:
        description: >-
          The request headers must contain `Content-Type:
          application/octet-stream`.

          The request body must contain the contents of your (`.foxe`) extension
          file.

          All other information about the extension will be parsed from the
          package.json file.


          **`package.json` requirements**


          An extension is uniquely identified by its publisher and name, which
          are

          both required in your `package.json`. Both values are
          case-insensitive,

          so a package named `custompanel` would be the same as one named
          `CustomPanel`.


          To update an extension, change its version in `package.json`, create a

          new `.foxe` bundle, and upload it via this endpoint. Version numbers
          must

          be unique to each extension. There are no other restrictions on
          versioning schemes.


          To publish an extension to your organization, your `package.json` must
          define

          a `displayName`. This is displayed to users in your organization.


          Once an extension is uploaded, its `displayName` may not be changed by
          future versions.
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      security:
        - ApiKey:
            - extensions.create
      responses:
        '200':
          description: Extension ID
          content:
            application/json:
              schema:
                properties:
                  id:
                    type: string
                required:
                  - id
        '409':
          description: Conflict with package name and version
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
