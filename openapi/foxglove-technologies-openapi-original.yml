      x-codeSamples:
        - lang: python
          label: Python
          source: |
            from foxglove.client import Client
            from datetime import datetime, timedelta

            token = "<YOUR API TOKEN HERE>"
            client = Client(token=token)

            client.get_topics(
                device_id=device_id,
                start=datetime.now() - timedelta(hours=3),
                end=datetime.now() - timedelta(hours=1),
