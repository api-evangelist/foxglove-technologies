      description: >
        Returns a list of values and the time intervals for which they were in
        effect for a device.


        Use the `query` parameter to filter property history on custom property
        key/value criteria.

        Syntax:

        * `key:value`: matches rows where the property key is `key` and the
        value equals `value`; use double quotes if the value contains spaces or
        special characters

        * `key:value1,value2`: matches rows where the property key is `key` and
        the value is either `value1` or `value2`

        * `key:*`: matches rows where the property key is `key` and any value

        * `*:value`: matches rows where any key has the value `value`

        * `foo`: matches rows where any key or stringified value contains `foo`

        Multiple qualifiers can be used in the same query string; this will
        filter rows matching the intersection of the qualifiers (AND).
      security:
        - ApiKey:
            - devices.list
      x-projectIdOptional: true
