          schema:
            type: string
            minLength: 1
          required: false
        - in: query
          name: recordingKey
          description: Key of the recording from which to list topics
          schema:
            type: string
            minLength: 1
          required: false
        - in: query
          name: deviceId
          description: ID of device being queried
          schema:
            type: string
            minLength: 1
          required: false
        - in: query
          name: device.name
          description: Equivalent to deviceName, and ignored if deviceName is supplied
          schema:
            type: string
            minLength: 1
          required: false
          deprecated: true
        - in: query
          name: deviceName
          description: Name of device being queried
          schema:
            type: string
            minLength: 1
          required: false
        - in: query
          name: device.id
          description: Equivalent to deviceId, and ignored if deviceId is supplied
          schema:
