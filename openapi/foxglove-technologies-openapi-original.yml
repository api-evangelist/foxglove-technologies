      summary: List coverage
      description: >-
        A coverage range represents a time span for which Foxglove has data for
        a

        given device.


        You must specify the `start` and `end` arguments when making a coverage
        request.


        Note: By default, only coverage ranges with imported recordings are
        returned. To include

        coverage ranges with unimported recordings from an Edge Site or a device
        running Foxlet, set the

        `includeEdgeRecordings` query parameter to true
      security:
        - ApiKey:
            - data.coverage.list
      x-codeSamples:
        - lang: python
          label: Python
          source: |
            from foxglove.client import Client
            from datetime import datetime, timedelta

            token = "<YOUR API TOKEN HERE>"
            client = Client(token=token)

            client.get_coverage(
                start=datetime.now() - timedelta(hours=3),
                end=datetime.now() - timedelta(hours=1),
            )
      parameters:
        - $ref: '#/components/parameters/start'
        - $ref: '#/components/parameters/end'
        - in: query
          name: tolerance
          description: >
            Minimum interval (in seconds) that ranges must be separated by to be
            considered discrete.

            Currently, the minimum meaningful value is 14s and smaller values
            will be clamped to this value.
          schema:
            type: number
            minimum: 0
          required: false
        - in: query
          name: deviceId
