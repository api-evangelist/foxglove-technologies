  /events:
    get:
      tags:
        - Events
      security:
        - ApiKey:
            - events.list
      summary: List events
      description: >
        Retrieve a list of events.


        Use the `query` parameter to filter events on key/value criteria.

        The `queryFields` parameter can be used in combination with `query` to
        specify

        which fields to filter events by.


        Syntax:


        * `key:value`: matches events with metadata that contains a key named
        `key` with a value of `value`; use double quotes if the value contains
        spaces or special characters

        * `key:value1,value2`: matches events with metadata that contains a key
        named `key` with a value of either `value1` or `value2`

        * `key:*`: matches events where any metadata that contains a key named
        `key`

        * `*:value`: matches events where any metadata that contains `value` as
        a value

        * `foo`: matches events with metadata where any key or value string
        contains `foo`


        Multiple qualifiers can be used in the same query string; this will
        filter events where metadata matches the intersection of the qualifiers
        (AND).


        Examples:


        * `key1:value1 key2:value2`: matches metadata that contains both a key
        named `key1` with its value `value1` and another key named `key2` with
        its value `value2`

        * `key:"value with spaces"`: matches metadata with a key named `key` and
        its value `value with spaces`

        * `key:value foo`: matches metadata that contains both a key named `key`
        with its value `value` and any key or value that contains the text `foo`


        > Note: The `start` and `end` query arguments will find any events which
        intersect the query range (inclusive of start and end).
      x-codeSamples:
        - lang: python
          label: Python
          source: |
            from foxglove.client import Client
            from datetime import datetime, timedelta

            token = "<YOUR API TOKEN HERE>"
            client = Client(token=token)

            client.get_events(
                device_id=device_id,
                sort_by=sort_by,
                sort_order=sort_order,
                limit=limit,
                offset=offset,
                start=datetime.now() - timedelta(hours=3),
                end=datetime.now() - timedelta(hours=1),
                query="key:val"
            )
      parameters:
        - $ref: '#/components/parameters/start'
        - $ref: '#/components/parameters/end'
        - in: query
          name: createdAfter
          description: |
            Return all events created after this date and time
          schema:
            type: string
            format: date-time
        - in: query
          name: updatedAfter
          description: |
            Return all events updated after this date and time
          schema:
            type: string
            format: date-time
        - in: query
          name: projectId
          description: Filter events by project
          schema:
            type: string
          required: false
        - in: query
          name: deviceId
          description: Filter events matching device ID
          schema:
            type: string
        - in: query
          name: eventId
          description: Filter events by exact event ID
          schema:
            type: string
        - in: query
          name: deviceName
          description: Name of device associated with the event
          schema:
            type: string
        - in: query
          name: device.name
          description: Equivalent to deviceName, and ignored if deviceName is supplied
          schema:
            type: string
          deprecated: true
        - in: query
          name: device.id
          description: Equivalent to deviceId, and ignored if deviceId is supplied
          schema:
            type: string
          deprecated: true
        - in: query
          name: query
          description: >-
            Event query string. Comprises a space-separated list of event
            queries, where the syntax of those queries is described above.
          schema:
            type: string
        - in: query
          name: queryFields
          description: Which fields to query events by. Defaults to "metadata".
          explode: false
          schema:
            type: array
            items:
              type: string
              enum:
                - metadata
                - properties
        - in: query
          name: sortBy
          description: field to sort response items by
          schema:
            type: string
            enum:
              - id
              - deviceId
              - deviceName
              - device.name
              - device.id
              - start
              - createdAt
              - updatedAt
        - in: query
          name: eventTypeId
          description: Filter events by their event type.
          schema:
            type: string
        - $ref: '#/components/parameters/sortOrder'
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/offset'
      responses:
        '200':
          description: A list of device events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Event'
    post:
      tags:
        - Events
      security:
        - ApiKey:
            - events.create
      x-projectIdOptional: true
      summary: Create an event
      description: |
        Create a new event.

        Note: Creating an new event currently requires a device ID or device
          name, however the `device` field on the Event resource responses is
          optional to allow future API expansion for attaching events to other
