      security:
        - ApiKey:
            - sites.list
      description: |
        Get details for a specific site.
      responses:
        '200':
          description: Site
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Site'
    patch:
      tags:
        - Sites
      summary: Update site details
      description: |
        Update the name or retention period for a Site.
      security:
        - ApiKey:
            - sites.update
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: A name for this site
                retainRecordingsSeconds:
                  type: number
                  description: >
                    Optionally set a retention period for recordings created at
                    this Edge Site.

                    If set to zero, recordings are retained indefinitely.

                    (only available on Edge Sites)
                url:
                  type: string
                  description: >
                    The URL a self-hosted Primary Site exposes for accessing
                    available data.

                    See [The self-hosting installation
                    guide](https://docs.foxglove.dev/docs/primary-sites/self-hosting/installation#configure-foxglove)

                    for details.
      responses:
        '200':
          description: Updated site
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Site'
    delete:
      tags:
        - Sites
      summary: Delete a site
      security:
        - ApiKey:
            - sites.delete
      description: >
        Delete a site.


        _NOTE: Site deletion is permanent and cannot be undone. Any recordings
        stored at this site

        will no longer be available through Foxglove._


        For `edge` and `self-hosted` sites, you should shut down your deployment
        before deleting

        the site through the API.


        If the site type is `self-hosted`, the contents of your inbox and lake
        buckets will not be

        affected by this action, and should be cleaned up separately after
        deleting the site.


        If the site type is `edge`, any files in edge storage will not be
        affected by this action.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    description: ID of the deleted site
                required:
                  - id
