  /data/stream:
    post:
      tags:
        - Stream data
      summary: Download data
      x-projectIdOptional: true
      description: >
        This endpoint returns a `link` URL where you can download your data as
        an `.mcap` or `.bag`

        file.


        To download your data:
          1. Make a request to this endpoint.
          2. Make a `GET` request to the `link` URL.

        One of `recordingId`, `key`, `importId` (deprecated) or all three of

        `deviceId`/`deviceName`, `start`, and `end` must be specified.


        _Note: You can only export a `.bag` file if you originally uploaded a
        `.bag` file._
      security:
        - ApiKey:
            - data.stream
      x-codeSamples:
        - lang: python
          label: Python
          source: |
            from foxglove.client import Client, CompressionFormat, OutputFormat
            from datetime import datetime, timedelta

            token = "<YOUR API TOKEN HERE>"
            client = Client(token=token)

            bytes = client.download_data(
                device_id=device_id,
                start=datetime.now() - timedelta(hours=3),
                end=datetime.now() - timedelta(hours=1),
                topics=["/clock", "/tracked_objects"],
                output_format=OutputFormat.mcap,
                compression_format=CompressionFormat.lz4,
                callback=lambda progress: print(".", end=""),
            )

            # Or, to download using a recording ID:
            bytes = client.download_recording_data(id="rec_0dHT6g6cOfff9m5U")
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                topics:
                  type: array
                  items:
                    type: string
                  description: >-
                    List of topics to include in the exported file (defaults to
                    all topics)
                outputFormat:
                  type: string
                  description: |
                    Output file format.
                      * `bag1` - output a .bag file
                      * `mcap` - output a .mcap file
                      * `mcap0` - Deprecated. Use `mcap`.
                  enum:
                    - bag1
                    - mcap
                    - mcap0
                compressionFormat:
                  type: string
                  description: >
                    Output compression format for chunks. Only valid if
                    `outputFormat` is `mcap`.
                      * `""` - no compression
                      * `zstd` - zstd compression
                      * `lz4` - LZ4 compression (default)
                  default: lz4
                  enum:
                    - ''
                    - zstd
                    - lz4
                includeAttachments:
                  type: boolean
                  description: >
                    Include attachments in streamed data. One of `recordingId`
                    or `importId`

                    (deprecated) must also be set. Only valid for mcap
                    outputFormat.
                isHosted:
                  type: boolean
                  description: true if the import is hosted
                replayPolicy:
                  type: string
                  description: >
                    If set to "lastPerChannel", then the stream will include the
                    most recent message

                    on each channel, even if it comes before the requested
                    `start`, as long as it is

                    within the window of `replayLookbackSeconds` seconds before
                    `start`.


                    The default, `""` (no policy), means no messages before
                    `start` are included.
                  enum:
                    - lastPerChannel
                    - ''
                replayLookbackSeconds:
                  type: number
                  description: >
                    The maximum amount of time (in seconds) to look back before
                    `start` in order to

                    find the latest message. Only used if `replayPolicy` is set
                    to "lastPerChannel".
                  minimum: 0
                deviceId:
                  type: string
                  description: ID of device associated with the exported data
                  minLength: 1
                device.id:
                  type: string
                  description: Equivalent to deviceId, and ignored if deviceId is supplied
                  deprecated: true
                  minLength: 1
                deviceName:
                  type: string
                  description: Name of device associated with the exported data.
                  minLength: 1
                device.name:
                  type: string
                  description: >-
                    Equivalent to deviceName, and ignored if deviceName is
                    supplied
                  deprecated: true
                  minLength: 1
                start:
                  type: string
                  format: date-time
                  description: >-
                    Inclusive start of requested time range. If start is
                    provided, end must be too.
                end:
                  type: string
                  format: date-time
                  description: >-
                    Inclusive end of requested time range. If end is provided,
                    start must be too.
                importId:
                  type: string
                  description: ID of the import to stream
                  deprecated: true
                  minLength: 1
                recordingId:
                  type: string
                  description: ID of the recording to stream
                  minLength: 1
                recordingKey:
                  type: string
                  description: Key of recording to stream
                  minLength: 1
                key:
                  type: string
                  deprecated: true
                  description: Key of recording to stream
                  minLength: 1
                sessionId:
                  type: string
                  description: ID of a session to stream
                  minLength: 1
                sessionKey:
                  type: string
                  description: >-
                    Key of a session to stream. Ensure projectId is provided if
                    streaming by sessionKey.
                  minLength: 1
                projectId:
                  type: string
                  description: >
                    ID of a project to scope the streaming to. Recommended when
                    streaming by deviceName.

                    Required if the device name exists in multiple projects.
                    Required when streaming by sessionKey.
                  minLength: 1
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  link:
                    type: string
                    description: >-
                      A signed url to access the data. This link expires after
                      15 seconds.
                required:
                  - link
  /data/upload:
    post:
      tags:
        - Recordings
      summary: Upload a recording
      description: >
        Use this endpoint to upload data to your `foxglove-hosted` site. The
        upload is a two-request

        process.


        1. Make a request to this upload endpoint to create an upload `link`.

        2. Issue a PUT HTTP request to the `link` response field URL.


        _Your PUT request header should have `Content-Type:
        application/octet-stream`, and your

        request body should contain your file content._


        Note: If you are using a self-hosted site, see [this

        guide](https://docs.foxglove.dev/docs/primary-sites/self-hosting/manage-data)
        for uploading data.


        #### Size considerations


        While we support processing very large files, we generally recommend
        avoiding large (50GB+)

        files to reduce the chance of upload failures or processing issues. If
        you have tooling that

        generates very large files, consider splitting them up into smaller
        chunks.
      security:
        - ApiKey:
            - data.upload
      x-codeSamples:
        - lang: python
          label: Python
          source: |
            from foxglove.client import Client
            from pathlib import Path

            token = "<YOUR API TOKEN HERE>"
            client = Client(token=token)

            with Path("my_mcap_data.mcap").open("rb") as byte_stream:
                client.upload_data(
                    device_id=device_id,
                    filename="my_mcap_data.mcap",
                    data=byte_stream,
                    callback=lambda size, progress: print(size, progress),
                    project_id="<YOUR PROJECT ID HERE>",
                )
      requestBody:
        required: true
        description: >-
          In addition to `filename`, one of `deviceId`, `deviceName`, or `key`
          is required and `projectId` is recommended.
        content:
          application/json:
            schema:
              type: object
              properties:
                deviceId:
                  type: string
                  description: Foxglove ID of the associated device
                deviceName:
                  type: string
                  description: >-
                    Unique name of the associated device. If no device exists
                    with this name, the device will be created.
                device.name:
                  type: string
                  deprecated: true
                  description: >-
                    Equivalent to deviceName, and ignored if deviceName is
                    supplied
                device.id:
                  type: string
                  deprecated: true
                  description: Equivalent to deviceId, and ignored if deviceId is supplied
                filename:
                  type: string
                  description: Name of the file that will be uploaded
                key:
                  type: string
                  minLength: 1
                  description: A unique key to identify the recording
                projectId:
                  type: string
                  description: >-
                    The project ID that the recording belongs to. Required for
                    multi-project orgs if an existing device is not provided
                sessionId:
                  type: string
                  description: ID of an existing session to associate the upload with.
                sessionKey:
                  type: string
                  description: >-
                    Key of a session to associate the upload with. If no session
                    exists with this key, a new session will be created using
                    the provided device.
              required:
                - filename
      responses:
        '200':
          description: Upload details
          content:
            application/json:
              schema:
                type: object
                properties:
                  link:
                    type: string
                    description: >-
                      A signed upload URL. Upload your data to this URL using a
                      PUT request.
                  requestId:
                    type: string
                required:
                  - link
                  - requestId
  /data/topics:
    get:
      tags:
        - Topics
      summary: List topics
      description: >-
        Get a list of topics available for a device within a given time range.


        By default, this endpoint will not return the `schema` for each topic.
        To include

        the schemas, you must provide the `includeSchemas` query parameter.


        Use `start` and `end` to limit the response to overlapping recording
        ranges.


        Topics for not-imported recordings are only returned if no parameter is
        provided besides

        recordingId or recordingKey. This is because most parameters need the
        imported files to

        filter, and can only return an empty list if imports are unavailable.
      security:
        - ApiKey:
