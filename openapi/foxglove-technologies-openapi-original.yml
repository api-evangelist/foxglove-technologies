        - in: query
          name: device.id
          description: Equivalent to deviceId, and ignored if deviceId is supplied
          schema:
            type: string
          required: false
          deprecated: true
        - in: query
          name: includeEdgeRecordings
          description: >
            Include recordings from an Edge Site or a device running Foxlet in
            the response.


            When edge recordings are included, each item in the response array
            will also include the

