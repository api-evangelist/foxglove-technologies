    parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
        description: Project ID
components:
  securitySchemes:
    Session:
      type: apiKey
      in: cookie
      name: fox.session
      description: User permissions when signed into the website
    ApiKey:
      type: http
      scheme: bearer
      description: API key authentication using HTTP Bearer auth
    SiteBucketNotificationBearerToken:
      type: http
      scheme: bearer
      description: Site bucket notification authentication using HTTP Bearer auth
  schemas:
    Import:
      type: object
      properties:
        id:
          type: string
          description: Opaque ID
        importId:
          type: string
          deprecated: true
        orgId:
          type: string
        deviceId:
          type: string
        deviceName:
          type: string
        filename:
          type: string
        importTime:
          type: string
          format: date-time
          description: Imported timestamp
        start:
          type: string
          format: date-time
          description: Message log time start of imported data
        end:
          type: string
          format: date-time
          description: Message log time end of imported data
        inputType:
          type: string
          description: 'Supported input type: ROS 1 bag ("bag1") or MCAP v0.x ("mcap0") file'
        outputType:
          type: string
          description: >-
            Supported output type: ROS 1 bag ("bag1") or MCAP v0.x ("mcap0")
            file
        inputSize:
          type: number
          description: Size in bytes of the uploaded file
          format: bigint
        totalOutputSize:
          type: number
          description: Size in bytes of the data after processing
          format: bigint
        date:
          type: string
          description: Message log time start date in YYYYMMDD format e.g. 20170322
        deleted:
          type: boolean
      required:
        - id
        - importId
        - orgId
        - filename
        - importTime
        - start
        - end
    PendingImport:
      properties:
        createdAt:
          type: string
          format: date-time
          description: When the pending import was created
        deviceId:
          type: string
          description: ID of device
        deviceName:
          type: string
          description: Name of the device from which the import originated
        error:
          type: string
          description: Error message, if status is "error"
        filename:
          type: string
          description: Filename of the import
        importId:
          type: string
          description: ID of import; undefined until status is "complete"
        orgId:
          type: string
          description: ID of org to which the import belongs
        pipelineStage:
          type: string
          description: stage in the import pipeline the import currently occupies
        requestId:
          type: string
          description: ID of the import request
        projectId:
          type: string
          description: ID of the project to which the import belongs
        siteId:
          type: string
          description: ID of Primary Site where import will be stored
        status:
          type: string
          description: Status of initiated import
          enum:
            - received
            - processing
            - ready for indexing
            - error
            - complete
        updatedAt:
          type: string
          format: date-time
          description: When the pending import was last updated
        quarantinedAt:
          type: string
          format: date-time
          description: When the pending import was quarantined
      required:
        - createdAt
        - filename
        - orgId
        - pipelineStage
        - requestId
        - updatedAt
        - siteId
    Extension:
      type: object
      properties:
        id:
          type: string
          description: Assigned by backend
        name:
          type: string
          description: Name as it appears in your package.json
        publisher:
          type: string
          description: Publisher as it appears in your package.json
        displayName:
          type: string
          description: Display name as it appears in your package.json
        description:
          type: string
          nullable: true
          description: Description as it appears in the active version's package.json
        activeVersion:
          type: string
          nullable: true
          description: Version string as it appears in the active version's package.json
        sha256Sum:
          type: string
          nullable: true
          description: SHA-256 sum of the active version contents, encoded as hex
      required:
        - id
        - name
        - publisher
        - displayName
        - description
        - activeVersion
        - sha256Sum
    ExtensionWithSignedLink:
      allOf:
        - $ref: '#/components/schemas/Extension'
        - type: object
          properties:
            foxe:
              type: string
              description: Signed download link for the extension
          required:
            - foxe
    Coverage:
      type: object
      description: >-
        A coverage range represents a time span for which Foxglove has data for
        a given device. Recordings without devices are omitted except when
        queried by recording ID or import ID.
      properties:
        deviceId:
          type: string
          description: ID of device.
        device:
          description: Device summary.
          $ref: '#/components/schemas/CoverageDeviceSummary'
        start:
          type: string
          format: date-time
          description: Start of this coverage
        end:
          type: string
          format: date-time
          description: End of this coverage
        status:
          type: string
          deprecated: true
          description: The status of the coverage range
          enum:
            - at-edge
            - import-pending
            - imported
        importStatus:
          $ref: '#/components/schemas/RecordingImportStatus'
      required:
        - start
        - end
        - status
    Topic:
      type: object
      description: A topic to which messages can be published.
      properties:
        encoding:
          type: string
          description: Encoding of the topic
        schema:
          type: string
          description: >-
            Full schema, base-64 encoded; included only if the request's
            includeSchemas is true
        schemaEncoding:
          type: string
          description: Encoding of the topic schema
        schemaName:
          type: string
          description: Name of the topic schema
        topic:
          type: string
          description: Topic name
        version:
          type: string
          description: Topic version
      required:
        - encoding
        - schemaEncoding
        - schemaName
        - topic
        - version
    EventTypeCustomProperty:
      type: object
      properties:
        id:
          type: string
          description: ID of the custom property
        required:
          type: boolean
          description: Whether the custom property is required for this event type
      required:
        - id
        - required
    EventType:
      type: object
      properties:
        id:
          type: string
          description: ID of the event type
        name:
          type: string
          description: Name of the event type
        createdAt:
          type: string
          format: date-time
          description: When the event type was created
        updatedAt:
          type: string
          format: date-time
          description: When the event type was last updated
        colorName:
          type: string
          description: Color name of the event type, e.g. "red"
        customProperties:
          type: array
          items:
            $ref: '#/components/schemas/EventTypeCustomProperty'
          description: Ordered array of custom properties associated with the event type
      required:
        - id
        - name
        - createdAt
        - updatedAt
    RecordingAttachment:
      type: object
      description: >-
        An attachment resource represents information about an MCAP attachment
        imported to Foxglove.
      properties:
        id:
          type: string
          description: ID of the attachment
        recordingId:
          type: string
          description: ID of the recording with which the attachment is associated
        siteId:
          type: string
          description: ID of the Primary Site where the attachment data is stored
        name:
          type: string
          description: Name field from the attachment record
        mediaType:
          type: string
          description: Media type from the attachment record
        logTime:
          type: string
          description: Log time field from the attachment record
        createTime:
          type: string
          description: Create time field from the attachment record
        crc:
          type: number
          description: CRC field from the attachment record as a decimal number
        dataOffset:
          type: integer
          description: Offset to the start of the attachment in bytes
        size:
          type: integer
          description: Size of the attachment in bytes
        fingerprint:
          type: string
          description: >
            A hash of the attachment content (algorithm subject to change). Two
            attachments

            with the same fingerprint will have identical content.
        lakePath:
          type: string
          description: >-
            Path of attachment in lake storage. Only provided for [self-hosted
            Primary
            Sites](https://docs.foxglove.dev/docs/primary-sites#self-hosted).
      required:
        - id
        - recordingId
        - siteId
        - name
        - mediaType
        - logTime
        - createTime
        - crc
        - size
        - fingerprint
    LayoutPermission:
      type: string
      enum:
        - CREATOR_WRITE
        - ORG_READ
        - ORG_WRITE
    Layout:
      type: object
      properties:
        id:
          type: string
          description: ID of the layout
        name:
          type: string
          description: Name of the layout
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the layout was created on the server
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the layout was last updated on the server
        savedAt:
          type: string
          format: date-time
          description: Timestamp when the layout was last saved locally
        folderName:
          type: string
          description: Name of the folder the layout belongs to.
        permission:
          $ref: '#/components/schemas/LayoutPermission'
        data:
          type: object
          description: >
            An object containing the layout data.


            Note: The layout data format is not considered stable and may change
            over time.
          additionalProperties: true
      required:
        - id
        - name
        - createdAt
        - updatedAt
        - permission
    NewCustomProperty:
      type: object
      properties:
        key:
          description: >
            An immutable identifier for this custom property; it cannot be
            edited once saved.


            This key is used to identify the custom property in queries; for
            example, when filtering

            your devices by a custom property ("partNumber:456").
          type: string
          minLength: 1
          maxLength: 32
          pattern: ^[A-Za-z0-9_-]+$
        label:
          description: Display label for user interfaces. May be changed after saving.
          type: string
          minLength: 1
          maxLength: 32
        resourceType:
          description: Resource type to which this custom property may be assigned
          type: string
          enum:
            - device
            - event
            - session
        valueType:
          description: |
            The type of the values associated with this custom property
            Number values will be treated as IEEE 754 64-bit floats.
          type: string
          enum:
            - string
            - multiline-string
            - number
            - enum
            - boolean
            - multi-enum
        values:
          description: >-
            Moved to `enumValues`. Allowed string values; required if
            `valueType` is "enum"
          deprecated: true
          type: array
          items:
            type: string
          uniqueItems: true
        enumValues:
          description: Allowed string values; required if `valueType` is "enum"
          type: array
          items:
            type: string
          uniqueItems: true
      required:
        - key
        - label
        - resourceType
        - valueType
    CustomProperty:
      type: object
      allOf:
        - type: object
          properties:
            id:
              type: string
              description: ID of the custom property
          required:
            - id
            - hasAssociatedData
        - $ref: '#/components/schemas/NewCustomProperty'
    Site:
      type: object
      properties:
        id:
          type: string
          description: Unique identifier for this site
        name:
          type: string
          description: Name for this site
        type:
          type: string
          description: >
            The type of the site.

            - `foxglove-hosted`: A [Foxglove-hosted Primary
            Site](https://docs.foxglove.dev/docs/primary-sites#foxglove-hosted).

            - `self-hosted`: A [self-hosted Primary
            Site](https://docs.foxglove.dev/docs/primary-sites#self-hosted).

            - `edge`: An [Edge Site](https://docs.foxglove.dev/docs/edge-sites).

            - `byob`: A [Bring Your Own Storage
            Site](https://docs.foxglove.dev/docs/primary-sites#bring-your-own-storage).
          enum:
            - foxglove-hosted
            - self-hosted
            - edge
            - byob
        url:
          type: string
          description: |
            The REST API endpoint your site deployment exposes
            (only available for self-hosted Primary Sites).
        retainRecordingsSeconds:
          type: number
          minimum: 0
          description: >
            An optional retention period for recordings created at this site. If
            set to zero, recordings are retained indefinitely. (only available
            on Edge Sites)
      required:
        - id
        - name
        - type
    InboxNotificationToken:
      type: object
      description: >-
        An inbox notification token authenticates bucket notifications for a
        Primary Site (self-managed or BYOS) to the Foxglove API.
      properties:
        id:
          type: string
        orgId:
          type: string
        createdAt:
          type: string
          format: date-time
          description: Timestamp of the inbox notification token's creation
        siteId:
          type: string
          description: ID of the associated Primary Site
      required:
        - id
        - orgId
        - createdAt
        - siteId
    DeviceToken:
      type: object
      description: A DeviceToken authenticates a device to the API.
      properties:
        id:
          type: string
        createdAt:
          type: string
          format: date-time
          description: Timestamp of the device token's creation
        deviceId:
          type: string
          nullable: true
          description: ID of the associated device
        projectId:
          type: string
          description: ID of the associated project
        enabled:
          type: boolean
          description: Whether this token is enabled or not
        preapproved:
          type: boolean
          description: Whether devices created with this token are preapproved
      required:
        - id
        - createdAt
        - projectId
        - enabled
        - preapproved
    SiteToken:
      type: object
      description: >-
        A SiteToken resource provides site controllers with authentication to
        the api.
      properties:
        id:
          type: string
          description: ID of the site token
        createdAt:
          type: string
          format: date-time
          description: Timestamp of the site token's creation
        siteId:
          type: string
          description: ID of the associated Primary or Edge Site
      required:
        - id
        - createdAt
        - siteId
    RecordingImportStatus:
      type: string
      description: >
        The import status of recordings. Status will be one of:

        - `none`: The recording has not yet been imported, and import has not
        been requested.

        - `pending`: Foxglove has received a request to import this recording.

        - `importing`: The recording data is being processed for access via
        Foxglove.

        - `failed`: The recording data could not be imported.

        - `complete`: The contents of the recording are available for access via
        Foxglove.


        Note: `none` and `pending` statuses are applicable only to recordings
        originating from an Edge Site or a device running Foxlet.


        The set of `importStatus` values may expand in the future.
      enum:
        - none
        - pending
        - importing
        - failed
        - complete
    DeviceSummary:
      type: object
      description: |
        ID and name of a device.
      properties:
        id:
          type: string
        name:
          type: string
      required:
        - id
        - name
    EdgeSiteSummary:
      type: object
      description: |
        ID and name of an edge site.
      properties:
        id:
          type: string
        name:
          type: string
      required:
        - id
        - name
    PrimarySiteSummary:
      type: object
      description: |
        ID and name of a primary site.
      properties:
        id:
          type: string
        name:
          type: string
        indexingStrategy:
          type: string
          enum:
            - split-files
            - index-in-place
      required:
        - id
        - name
        - indexingStrategy
    webhook_payloads:
      Common:
        type: object
        properties:
          type:
            description: The event type
            type: string
          timestamp:
            description: When the webhook event occurred
            format: date-time
            type: string
          attemptedAt:
            description: When the delivery was attempted
            format: date-time
            type: string
          webhookEventId:
            description: ID of the associated webhook event
            type: string
          webhookId:
            description: ID of the webhook that notified your endpoint
            type: string
        required:
          - type
          - timestamp
          - attemptedAt
          - webhookId
          - webhookEventId
      Recording:
        allOf:
          - $ref: '#/components/schemas/webhook_payloads/Common'
          - properties:
              recording:
                properties:
                  id:
                    description: Recording ID
                    type: string
                  key:
                    description: User-assigned key (if specified during recording upload)
                    type: string
                  sessionId:
                    description: ID of the session associated with this recording
                    type: string
                  importStatus:
                    $ref: '#/components/schemas/RecordingImportStatus'
                  path:
                    description: The filepath the recording was created with
                    type: string
                  device:
                    $ref: '#/components/schemas/DeviceSummary'
                  edgeSite:
                    $ref: '#/components/schemas/EdgeSiteSummary'
                  site:
                    $ref: '#/components/schemas/PrimarySiteSummary'
                required:
                  - id
                  - path
                  - importStatus
                type: object
            projectId:
              description: The ID of the project this recording belongs to
              type: string
            required:
              - recording
              - projectId
            type: object
      RecordingCreated:
        allOf:
          - $ref: '#/components/schemas/webhook_payloads/Recording'
          - properties:
              type:
                type: string
                const: recording.created
      RecordingImported:
        allOf:
          - $ref: '#/components/schemas/webhook_payloads/Recording'
          - properties:
              type:
                type: string
                const: recording.imported
      DeviceCreated:
        allOf:
          - $ref: '#/components/schemas/webhook_payloads/Common'
          - properties:
              device:
                properties:
                  id:
                    description: Device ID
                    type: string
                required:
                  - id
                type: object
              projectId:
                description: The ID of the project this device belongs to
                type: string
            required:
              - device
              - projectId
            type: object
      DeviceUpdated:
        allOf:
          - $ref: '#/components/schemas/webhook_payloads/Common'
          - properties:
              device:
                properties:
                  id:
                    description: Device ID
                    type: string
                required:
                  - id
                type: object
              projectId:
                description: The ID of the project this device belongs to
                type: string
            required:
              - device
              - projectId
            type: object
      SessionCreated:
        allOf:
          - $ref: '#/components/schemas/webhook_payloads/Common'
          - properties:
              session:
                properties:
                  id:
                    description: Session ID
                    type: string
                  device:
                    $ref: '#/components/schemas/DeviceSummary'
                  key:
                    description: User-assigned key (if specified)
                    type: string
                required:
                  - id
                type: object
              projectId:
                description: The ID of the project this session belongs to
                type: string
            required:
              - session
              - projectId
            type: object
      EventCreated:
        allOf:
          - $ref: '#/components/schemas/webhook_payloads/Common'
          - properties:
              event:
                properties:
                  id:
                    description: Event ID
                    type: string
                required:
                  - id
                type: object
              projectId:
                description: The ID of the project this event belongs to
                type: string
            required:
              - event
              - projectId
            type: object
      EventUpdated:
        allOf:
          - $ref: '#/components/schemas/webhook_payloads/Common'
          - properties:
              event:
                properties:
                  id:
                    description: Event ID
                    type: string
                required:
                  - id
                type: object
              projectId:
                description: The ID of the project this event belongs to
                type: string
            required:
              - event
              - projectId
            type: object
      Ping:
        allOf:
          - $ref: '#/components/schemas/webhook_payloads/Common'
          - properties:
              webhook:
                properties:
                  id:
                    description: Webhook ID
                    type: string
                required:
                  - id
                type: object
              type:
                type: string
                const: ping
            required:
              - event
            type: object
    CustomPropertyValues:
      type: object
      additionalProperties:
        oneOf:
          - type: string
          - type: number
          - type: boolean
          - type: array
            items:
              type: string
            uniqueItems: true
    Device:
      type: object
      properties:
        id:
          type: string
          description: Opaque identifier
        name:
          type: string
          description: Organization-chosen device name
        projectId:
          type: string
          description: The project ID that the device belongs to
        retainRecordingsSeconds:
          type: number
          description: >
            The retention period for recordings created on this device. If set
            to

            zero, recordings are retained indefinitely. This is only relevant
            for

            devices that have Foxlet installed.
        properties:
          $ref: '#/components/schemas/CustomPropertyValues'
          description: >
            A key-value map of the custom properties associated with this
            device.
        enabled:
          type: boolean
          description: >
            Whether this device is enabled. Devices are enabled by default,

            unless they are created with a device token with `preapproved` set
            to false.

            Disabled devices show up in the device list, but you can't upload
            recordings

            for them. A device token linked to a disabled device does not grant
            access to the API.
        remoteAccessEnabled:
          type: boolean
          description: >
            Whether remote access is enabled for this device. When disabled, the
            device

            cannot establish new remote access sessions.
        autoDeleteAfterImport:
          type: boolean
          description: >
            Whether recordings on this device are automatically deleted once
            they have

            been successfully uploaded and accepted for import. This is only
            relevant

            for devices that have Foxlet installed.
      required:
        - id
        - name
        - projectId
        - enabled
        - remoteAccessEnabled
        - autoDeleteAfterImport
        - agentSupportsAutoDelete
    DeviceDetails:
      type: object
      properties:
        orgId:
          type: string
        createdAt:
          type: string
          format: date
        updatedAt:
          type: string
          format: date-time
    DeviceRemoteAccessState:
      type: object
    deviceName:
      type: string
      maxLength: 100
      description: The name of the device.
      pattern: ^[A-Za-z0-9_.-]+$
    RecordingMetadata:
      type: object
      description: |
        MCAP metadata pertaining to a recording.
      properties:
        name:
          type: string
        metadata:
          type: object
          additionalProperties:
            type: string
      required:
        - name
        - metadata
    Recording:
      type: object
      description: >
        A resource representing the content of an MCAP file or ROS bag managed
        by Foxglove.
      properties:
        id:
          type: string
          description: ID of the recording
        projectId:
          type: string
          description: The project ID that the recording belongs to
        path:
          type: string
          description: >
            The filepath of the recording as it was originally provided to
            Foxglove.

            For recordings originated at the edge, this is the full path of the
            recording file in

            the edge controller store. For recordings uploaded directly to
            Foxglove, this is

            the `filename` query arg provided to `/data/upload`.
        size:
          type: number
          description: The size of the recording file, in bytes
          format: bigint
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the recording file was added to Foxglove.
        importedAt:
          type: string
          format: date-time
          description: Timestamp when the recording was imported to a primary site.
        start:
          type: string
          format: date
          description: The log time of the first message in the recording.
        end:
          type: string
          format: date
          description: The log time of the last message in the recording.
        importStatus:
          $ref: '#/components/schemas/RecordingImportStatus'
        site:
          description: The primary site for this recording.
          $ref: '#/components/schemas/PrimarySiteSummary'
        edgeSite:
          description: The edge site for this recording.
          $ref: '#/components/schemas/EdgeSiteSummary'
        device:
          $ref: '#/components/schemas/DeviceSummary'
        key:
          type: string
          description: >
            The unique, user-specified key assigned to a recording in MCAP
            metadata or during the upload

            process. This can be used to identify the recording, in addition to
            its `id`.
        metadata:
          type: array
          description: The metadata records of the original MCAP file content
          items:
            $ref: '#/components/schemas/RecordingMetadata'
        sessionId:
          type: string
          description: The ID of the session this recording belongs to.
      required:
        - id
        - projectId
        - path
        - size
        - start
        - end
        - createdAt
        - importStatus
    RecordingSession:
      type: object
      description: >
        A recording session represents a logical grouping of recordings from a
        single device.
      properties:
        id:
          type: string
          description: ID of the recording session
        projectId:
          type: string
          description: The project ID that the session belongs to
        device:
          $ref: '#/components/schemas/DeviceSummary'
        key:
          type: string
          description: |
            A user-supplied identifier, unique within the project.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the session was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the session was last updated.
        properties:
          $ref: '#/components/schemas/CustomPropertyValues'
          description: >
            A key-value map of the custom properties associated with this
            session.
        recordings:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                description: ID of the recording
              path:
                type: string
                description: >
                  The filepath of the recording as it was originally provided to
                  Foxglove.

                  For recordings originated at the edge, this is the full path
                  of the recording file in

                  the edge controller store. For recordings uploaded directly to
                  Foxglove, this is

                  the `filename` query arg provided to `/data/upload`.
              start:
                type: string
                format: date-time
                description: The log time of the first message in the recording.
              end:
                type: string
                format: date-time
                description: The log time of the last message in the recording.
            required:
              - id
              - path
              - start
              - end
          description: Recordings associated with this session.
      required:
        - id
        - projectId
        - device
        - createdAt
        - updatedAt
        - recordings
    RecordingSessionListItem:
      allOf:
        - $ref: '#/components/schemas/RecordingSession'
        - type: object
          properties:
            recordingCount:
              type: number
              readOnly: true
              description: Number of recordings associated with this session.
            recordingStart:
              type: string
              format: date-time
              readOnly: true
              description: >-
                Earliest log time among visible recordings associated with this
                session.
            recordingEnd:
              type: string
              format: date-time
              readOnly: true
              description: >-
                Latest log time among visible recordings associated with this
                session.
          required:
            - recordingCount
    CoverageDeviceSummary:
      allOf:
        - $ref: '#/components/schemas/DeviceSummary'
        - type: object
          properties:
            pendingCoverageUpdate:
              type: object
              optional: true
              description: >
                If the device has a pending coverage update, this object will
                contain the timestamp when the coverage refresh was last
                enqueued.

                If null, the device has no pending coverage update.
              properties:
                nextInvalidationRequestedAt:
                  type: string
                  format: date-time
                  description: >-
                    The timestamp when the device's coverage refresh was last
                    enqueued.
    DeviceCustomPropertyTimeInterval:
      type: object
      properties:
        id:
          type: string
          description: ID of the property time interval.
        deviceId:
          type: string
          description: ID of the associated device.
        key:
          type: string
          description: Key of the property.
        value:
          description: Value of the property.
          oneOf:
            - type: string
            - type: number
            - type: boolean
            - type: array
              items:
                type: string
              uniqueItems: true
        start:
          type: string
          format: date-time
          description: Inclusive start time this value was in effect.
        end:
          type: string
          format: date-time
          description: >-
            Exclusive end time this value was in effect. When absent the value
            is still in effect.
      required:
        - id
        - deviceId
        - key
        - value
        - start
    Error:
      type: object
      properties:
        error:
          type: string
      required:
        - error
    Event:
      type: object
      properties:
        id:
          type: string
          description: ID of the event
        start:
          type: string
          format: date-time
          description: Event start time (inclusive)
        end:
          type: string
          format: date-time
          description: Event end time (inclusive)
        deviceId:
          type: string
          deprecated: true
          description: |
            ID of the device associated with the event.

            **deprecated**: Use `device.id` instead.
        device:
          $ref: '#/components/schemas/DeviceSummary'
        metadata:
          type: object
          additionalProperties: true
          required: []
          description: Any metadata associated with the event
        createdAt:
          type: string
          format: date-time
          description: When the event was created
        updatedAt:
          type: string
          format: date-time
          description: When the event was last updated
        eventTypeId:
          type: string
          description: ID of the event type.
        properties:
          $ref: '#/components/schemas/CustomPropertyValues'
          description: |
            A key-value map of the custom properties associated with this event.
      required:
        - id
        - start
        - end
        - metadata
        - createdAt
        - updatedAt
    EventMetadataInput:
      type: object
      additionalProperties:
        type: string
      required: []
      description: >-
        An object with user-defined string keys and string values; key order is
        not preserved
    EventCreateInput:
      type: object
      properties:
        deviceId:
          type: string
          description: ID of the device to associate with the event
        deviceName:
          type: string
          description: Name of the device to associate with the event
        projectId:
          type: string
          description: >-
            Optional project ID used to disambiguate deviceName and deviceId
            lookups
        device.id:
          type: string
          description: Equivalent to deviceId, and ignored if deviceId is supplied
          deprecated: true
        device.name:
          type: string
          description: Equivalent to deviceName, and ignored if deviceName is supplied
          deprecated: true
        metadata:
          $ref: '#/components/schemas/EventMetadataInput'
        start:
          type: string
          description: Event start time (inclusive)
          format: date-time
        end:
          type: string
          description: Event end time (inclusive)
          format: date-time
        eventTypeId:
          type: string
          description: If provided, the event must conform to the event type's schema.
        properties:
          $ref: '#/components/schemas/CustomPropertyValues'
          description: >
            A key-value map, where each key is one of your pre-defined event
            custom property keys.

            Keys which are not recognized as custom properties will be ignored.
          required: []
      required:
        - start
        - end
    EventDeleteResponse:
      type: object
      properties:
        id:
          type: string
          description: ID of the deleted event.
      required:
        - id
    EventUpdatePropertiesInput:
      description: >
        A key-value map, where each key is one of your pre-defined event custom
        property keys.

        Keys which are not recognized as custom properties will be ignored.

        Keys which are not included in the request, but exist on the event, will
        be unchanged.

        To unset a property, pass `null` as the value.
      type: object
      additionalProperties: true
      required: []
    EventUpdateEventTypeIdInput:
      type: string
      description: >-
        If provided, the event must conform to the event type's schema. An empty
        string will remove the event type.
    EventUpdateInput:
      type: object
      properties:
        metadata:
          $ref: '#/components/schemas/EventMetadataInput'
        start:
          type: string
          description: Event start time (inclusive)
          format: date-time
        end:
          type: string
          description: Event end time (inclusive)
          format: date-time
        properties:
          $ref: '#/components/schemas/EventUpdatePropertiesInput'
        eventTypeId:
          $ref: '#/components/schemas/EventUpdateEventTypeIdInput'
    GenericSuccess:
      type: object
      properties:
        success:
          type: boolean
          const: true
      required:
        - success
    Project:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        orgMemberCount:
          type: number
          description: Number of org members that can access this project
        lastSeenAt:
          type: string
          format: date-time
          description: Timestamp of the last recording uploaded to this project
        isInviteOnly:
          type: boolean
          description: >-
            Whether this project is invite-only. If true, org members with the
            user role will need explicit permission to access the project
      required:
        - id
        - isInviteOnly
  parameters:
    sortOrder:
      in: query
      name: sortOrder
      description: Sort order for the `sortBy` field
      schema:
        type: string
        enum:
          - asc
          - desc
    limit:
      in: query
      name: limit
      description: Maximum number of items to return
      schema:
        type: number
        minimum: 0
        maximum: 2000
        default: 2000
    offset:
      in: query
      name: offset
      description: Number of items to skip before returning the results
      schema:
        type: integer
        minimum: 0
        default: 0
    start:
      in: query
      name: start
      description: Start of an inclusive time range
      schema:
        type: string
        format: date-time
    end:
      in: query
      name: end
      description: End of an inclusive time range
      schema:
        type: string
        format: date-time
