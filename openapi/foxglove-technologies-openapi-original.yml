            type: string
            enum:
              - id
              - key
              - start
              - end
          required: false
        - $ref: '#/components/parameters/sortOrder'
        - $ref: '#/components/parameters/offset'
        - $ref: '#/components/parameters/limit'
      responses:
        '200':
          description: Property time intervals
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DeviceCustomPropertyTimeInterval'
