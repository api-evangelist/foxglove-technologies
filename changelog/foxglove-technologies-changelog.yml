- version: Foxglove 2.59.0
  date: '2026-08-04'
  url: https://docs.foxglove.dev/changelog/foxglove/v2.59.0
  breaking: false
  highlights:
  - Desktop MCP server — the desktop app can run a local Model Context Protocol
    server so external coding assistants can see and control Foxglove; requires Pro
    or Enterprise and a developer seat.
  - Search with FoxQL and Gallery previews — query devices, metadata, topics and
    message fields, then review matches as preview cards.
  - Foxlet auto-delete of local files after import.
  - Recordings list renders before pending imports resolve.
